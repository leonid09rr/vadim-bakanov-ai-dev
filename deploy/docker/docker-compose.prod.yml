# PROD environment on VPS
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Differences from DEV:
# - restart: always (not unless-stopped)
# - logging with rotation
# - stricter resource limits possible
#
# CUSTOMIZE: Replace {project} with your project name

services:
  {project}-prod-postgres:
    image: postgres:16-alpine
    container_name: {project}-prod-postgres
    restart: always
    volumes:
      - {project}-prod-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME:-app}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - {project}-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  {project}-prod-redis:
    image: redis:7-alpine
    container_name: {project}-prod-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - {project}-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  {project}-prod-app:
    build: .
    container_name: {project}-prod-app
    restart: always
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      {project}-prod-postgres:
        condition: service_healthy
      {project}-prod-redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@{project}-prod-postgres:5432/${DB_NAME:-app}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@{project}-prod-redis:6379/0"
    networks:
      - {project}-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  {project}-prod-postgres-data:

networks:
  {project}-prod-network:
    name: {project}-prod-network
