# PROD Nginx Config — {YOUR_DOMAIN}
# SSL will be added by certbot: sudo certbot --nginx -d {YOUR_DOMAIN}
#
# CUSTOMIZE: Replace {YOUR_DOMAIN} and proxy port

server {
    listen 80;
    server_name {YOUR_DOMAIN} www.{YOUR_DOMAIN};
    return 301 https://{YOUR_DOMAIN}$request_uri;
}

# Redirect www to non-www
server {
    listen 443 ssl http2;
    server_name www.{YOUR_DOMAIN};

    # ssl_certificate /etc/letsencrypt/live/{YOUR_DOMAIN}/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/{YOUR_DOMAIN}/privkey.pem;

    return 301 https://{YOUR_DOMAIN}$request_uri;
}

server {
    listen 443 ssl http2;
    server_name {YOUR_DOMAIN};

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Static files with aggressive caching
    location /static/ {
        alias /var/www/{YOUR_DOMAIN}/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # App
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SSL — certbot will fill these in
    # ssl_certificate /etc/letsencrypt/live/{YOUR_DOMAIN}/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/{YOUR_DOMAIN}/privkey.pem;
}
