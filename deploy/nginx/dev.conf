# DEV Nginx Config — dev.{YOUR_DOMAIN}
# SSL will be added by certbot: sudo certbot --nginx -d dev.{YOUR_DOMAIN}
#
# CUSTOMIZE: Replace {YOUR_DOMAIN} and proxy port

server {
    listen 80;
    server_name dev.{YOUR_DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dev.{YOUR_DOMAIN};

    # Basic Auth (protect DEV from public)
    auth_basic "DEV Environment";
    auth_basic_user_file /etc/nginx/.htpasswd_{project}_dev;
    # Create: sudo htpasswd -c /etc/nginx/.htpasswd_{project}_dev {username}

    # No caching for dev
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # API/webhooks — bypass basic auth
    location /api/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # App (proxy to Docker container)
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SSL — certbot will fill these in
    # ssl_certificate /etc/letsencrypt/live/dev.{YOUR_DOMAIN}/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dev.{YOUR_DOMAIN}/privkey.pem;
}
